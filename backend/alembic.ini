# =========================================================
# alembic.ini — Konfigurasi Alembic untuk Topshop Kosmetik AI
# =========================================================

[alembic]
# Path ke folder script migrasi
script_location = alembic

# Format nama file migrasi
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone untuk timestamp
timezone = Asia/Jakarta

# Panjang truncate slug
truncate_slug_length = 40

# Versi lokasi (boleh multiple, pisahkan dengan spasi)
version_locations = %(here)s/alembic/versions

# Karakter pembatas versi
version_path_separator = os

# Koneksi database — akan di-override oleh env.py menggunakan DATABASE_URL dari config
sqlalchemy.url = postgresql+asyncpg://topshop:topshop_secret@localhost:5432/topshop_db

[post_write_hooks]
# Hooks yang dijalankan setelah file migrasi dibuat
# Aktifkan jika ingin auto-format dengan black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
