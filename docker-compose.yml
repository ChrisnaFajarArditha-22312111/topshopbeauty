version: "3.9"

# =========================================================
# Docker Compose — Topshop Kosmetik AI
# Orkestrasi service backend (FastAPI) dan database (PostgreSQL + pgvector)
# =========================================================

services:
  # -------------------------------------------------------
  # Service: PostgreSQL dengan pgvector
  # -------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: topshop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topshop_secret}
      POSTGRES_DB: ${POSTGRES_DB:-topshop_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-topshop} -d ${POSTGRES_DB:-topshop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - topshop_network

  # -------------------------------------------------------
  # Service: Backend FastAPI
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topshop_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - topshop_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# =========================================================
# Volumes
# =========================================================
volumes:
  postgres_data:
    driver: local

# =========================================================
# Networks
# =========================================================
networks:
  topshop_network:
    driver: bridge
